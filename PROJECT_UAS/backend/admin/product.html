<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kopikoe - Product</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f5f6f8;
      }

      .main-sidebar {
        background-color: #ead8c0 !important;
        border-right: 1px solid #dcc6a8;
        min-height: 100vh;
      }

      .brand-link {
        border-bottom: none !important;
        color: #000 !important;
        font-weight: 700;
        font-size: 1.5rem;
        padding-left: 1.5rem;
      }

      .nav-sidebar .nav-item .nav-link {
        color: #4a4a4a;
        font-weight: 600;
        padding: 12px 20px;
      }

      .nav-sidebar .nav-item .nav-link.active {
        background-color: #c6a984 !important;
        color: #000 !important;
        box-shadow: none !important;
        border-radius: 0 25px 25px 0;
        margin-right: 20px;
      }

      .content-wrapper {
        background-color: #f5f6f8 !important;
        padding: 30px 40px;
      }

      .product-container {
        background-color: #fff;
        border-radius: 12px;
        padding: 30px;
        min-height: 80vh;
      }

      .card-product {
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #fff;
        transition: 0.2s;
      }

      .card-product:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }

      .product-img-wrapper {
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .product-img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
      }

      .product-info {
        text-align: center;
        padding: 0 15px 15px;
      }

      .product-name {
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 5px;
      }

      .product-price {
        color: #666;
        font-size: 0.9rem;
      }

      .btn-edit-card {
        background-color: #f2ebe0;
        color: #8d7b68;
        border: none;
        width: 100%;
        padding: 12px;
        font-weight: 500;
        font-size: 0.9rem;
      }

      .card-add-new {
        border: 2px dashed #ffbca8;
        border-radius: 10px;
        height: 100%;
        min-height: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background-color: #fffaf9;
        color: #c6a984;
      }
    </style>
  </head>

  <body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
      <nav
        class="main-header navbar navbar-expand navbar-white navbar-light border-bottom-0"
        style="background: transparent"
      >
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
        </ul>
      </nav>

      <aside class="main-sidebar elevation-0">
        <a href="/admin/dashboard" class="brand-link"
          ><span class="brand-text">Kopikoe</span></a
        >
        <div class="sidebar">
          <nav class="mt-4">
            <ul
              class="nav nav-pills nav-sidebar flex-column"
              data-widget="treeview"
              role="menu"
            >
              <li class="nav-item">
                <a href="/admin/dashboard" class="nav-link"
                  ><i class="nav-icon fas fa-home"></i>
                  <p>Dashboard</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/profile" class="nav-link"
                  ><i class="nav-icon fas fa-clipboard-list"></i>
                  <p>Profile</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/product" class="nav-link active"
                  ><i class="nav-icon fas fa-utensils"></i>
                  <p>Product</p>
                </a>
              </li>
            </ul>
          </nav>
          <div
            class="sidebar-bottom"
            style="position: absolute; bottom: 20px; width: 100%"
          >
            <ul class="nav nav-pills nav-sidebar flex-column">
              <li class="nav-item">
                <a href="/auth/logout" class="nav-link text-danger"
                  ><i class="nav-icon fas fa-sign-out-alt"></i>
                  <p>Logout</p>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </aside>

      <div class="content-wrapper">
        <h2
          class="page-title"
          style="font-weight: 700; font-size: 1.5rem; margin-bottom: 20px">
          Product Management
        </h2>

        <div id="product-list-container" class="row">
            
            <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                <div class="card-add-new" data-toggle="modal" data-target="#addProductModal">
                    <div class="add-icon" style="font-size:2rem; margin-bottom:10px;">
                        <i class="fas fa-plus"></i>
                    </div>
                    <div class="add-text">Add new product</div>
                </div>
            </div>

          </div>
      </div>
    </div>
  </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("/api/products")
          .then((response) => response.json())
          .then((products) => {
            const container = document.getElementById("product-list-container");

            products.forEach((prod) => {
              // KEMBALI MENGGUNAKAN CLASS BOOTSTRAP GRID
              const html = `
                            <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                                <div class="card-product">
                                    <div class="product-img-wrapper">
                                        <img src="${prod.image}" alt="${prod.name}" class="product-img" onerror="this.src='/assets/logo kopikoe.png'">
                                    </div>
                                    <div class="product-info">
                                        <div class="product-name">${prod.name}</div>
                                        <div class="product-price">Rp ${new Intl.NumberFormat("id-ID").format(prod.price)}</div>
                                    </div>
                                    
                                    <div style="padding: 0 15px 15px; display: flex; gap: 10px;">
                                        <button class="btn-edit-card" onclick="alert('Fitur Edit belum tersedia untuk ID: ${prod.id}')" style="flex: 1;">
                                            <i class="fas fa-pen" style="font-size: 0.8rem; margin-right:5px;"></i> Edit
                                        </button>
                                        <button class="btn-edit-card" onclick="deleteProduct(${prod.id})" style="flex: 1; background-color: #fee2e2; color: #dc2626;">
                                            <i class="fas fa-trash" style="font-size: 0.8rem; margin-right:5px;"></i> Hapus
                                        </button>
                                    </div>

                                </div>
                            </div>
                        `;
              container.insertAdjacentHTML("beforeend", html);
            });
          })
          .catch((err) => console.error("Error loading products:", err));
      });

      function deleteProduct(id) {
          if(confirm('Apakah Anda yakin ingin menghapus produk ini?')) {
              fetch('/api/products/delete', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ id: id })
              })
              .then(response => response.json())
              .then(data => {
                  if(data.success) {
                      alert('Produk berhasil dihapus!');
                      location.reload(); 
                  } else {
                      alert('Gagal menghapus: ' + (data.message || 'Error'));
                  }
              })
              .catch(err => {
                  console.error(err);
                  alert('Gagal menghubungi server');
              });
          }
      }

      function submitNewProduct() {
        const name = document.getElementById('prodName').value;
        const price = document.getElementById('prodPrice').value;
        const image = document.getElementById('prodImage').value;
        const description = document.getElementById('prodDesc').value;

        if(!name || !price) {
            alert("Nama dan Harga wajib diisi!");
            return;
        }

        const payload = {
            name: name,
            price: price,
            image: image,
            description: description
        };

        fetch('/api/products/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Produk berhasil ditambahkan!');
                location.reload(); 
            } else {
                alert('Gagal menambahkan produk: ' + data.message);
            }
        })
        .catch(err => {
            console.error(err);
            alert('Terjadi kesalahan saat menyimpan produk.');
        });
      }
    </script>
    <div class="modal fade" id="addProductModal" tabindex="-1" role="dialog" aria-labelledby="modelTitleId" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Tambah Menu Baru</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addProductForm">
                    <div class="form-group">
                        <label>Nama Produk</label>
                        <input type="text" class="form-control" id="prodName" required placeholder="Contoh: Kopi Susu Gula Aren">
                    </div>
                    <div class="form-group">
                        <label>Harga (Rp)</label>
                        <input type="number" class="form-control" id="prodPrice" required placeholder="Contoh: 25000">
                    </div>
                    <div class="form-group">
                        <label>URL Gambar / Path Aset</label>
                        <input type="text" class="form-control" id="prodImage" placeholder="/assets/namagambar.png">
                        <small class="text-muted">Masukkan path gambar yang sudah diupload ke folder assets (contoh: /assets/ftkp1.png)</small>
                    </div>
                    <div class="form-group">
                        <label>Deskripsi</label>
                        <textarea class="form-control" id="prodDesc" rows="3" placeholder="Deskripsi singkat produk..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-primary" style="background-color: #C6A984; border-color: #C6A984;" onclick="submitNewProduct()">Simpan</button>
            </div>
        </div>
    </div>
</div>
  </body>
</html>
