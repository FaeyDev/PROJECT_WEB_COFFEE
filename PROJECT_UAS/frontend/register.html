<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoPiKoe Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kopikoe-purple': '#725CFA',
                        'kopikoe-dark': '#1e1e1e',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            /* Background image */
            background-image: url('/assets/ftbglg.jpg');
            background-size: cover;
            background-position: center;
        }

        .bg-overlay {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans bg-overlay">

    <div class="bg-white w-full max-w-[480px] p-10 rounded-3xl shadow-lg text-center mx-4">

        <div class="flex justify-center mb-0">
            <img src="/assets/logo kopikoe.png" alt="Logo"
                class="w-28 h-28 object-contain opacity-80">
        </div>

        <h2 class="text-2xl font-bold text-gray-900 mb-1">Create an account</h2>
        <p class="text-gray-500 text-sm mb-6">
            Already have an account? <a href="/login" class="text-blue-600 font-semibold hover:underline">Log in</a>
        </p>

        <div class="flex flex-col gap-3 mb-6">
            <button
                class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 py-2.5 rounded-full font-medium hover:bg-gray-50 transition">
                <i class="fa-brands fa-facebook text-blue-600 text-xl"></i>
                Continue with Facebook
            </button>

            <button
                class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 py-2.5 rounded-full font-medium hover:bg-gray-50 transition">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                Continue with Google
            </button>
        </div>

        <div class="flex items-center w-full mb-6">
            <div class="h-px bg-gray-200 flex-1"></div>
            <span class="text-gray-400 text-sm px-4">Or</span>
            <div class="h-px bg-gray-200 flex-1"></div>
        </div>

        <form id="registerForm" action="/auth/register" method="POST" class="text-left">
        
            <p class="text-sm text-gray-800 font-medium mb-4">
                Enter your email address to create an account.
            </p>
        
            <div class="mb-4">
                <label class="block text-gray-400 text-xs mb-1.5">Your email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-kopikoe-purple focus:ring-1 focus:ring-kopikoe-purple text-gray-700 bg-white placeholder-gray-300"
                    placeholder="name@example.com">
            </div>
        
            <div class="mb-6">
                <label class="block text-gray-400 text-xs mb-1.5">Create Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-kopikoe-purple focus:ring-1 focus:ring-kopikoe-purple text-gray-700 bg-white placeholder-gray-300"
                    placeholder="Buat kata sandi anda">
            </div>
        
            <button type="submit"
                class="w-full bg-[#C6C8D6] hover:bg-kopikoe-purple text-white font-semibold py-3 rounded-full transition duration-300 mt-2">
                Create an account
            </button>
        </form>

        <p id="message" class="mt-4 text-center text-sm font-medium"></p>

    </div>
</body>

</html>
